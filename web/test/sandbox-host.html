<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>plugin sandbox host</title>
		<style>
			html,
			body,
			iframe {
				margin: 0;
				width: 100%;
				height: 100%;
				border: 0;
			}
		</style>
	</head>
	<body>
		<iframe
			id="plugin"
			title="plugin"
			src="/ui/"
			sandbox="allow-scripts allow-forms"
		></iframe>
	</body>
</html>
